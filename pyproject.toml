[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=custom_components.mks_wifi --cov-branch --cov-report=term-missing"

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Close to Home Assistant core's rules. of Home Assistant core's rules.
select = [
    "A", "ASYNC", "B", "BLE", "C4", "D", "E", "F", "FLY", "G", "I", "ICN", "INP",
    "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PYI", "RET", "RSE",
    "RUF", "S", "SIM", "SLOT", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = [
    "D202", "D203", "D213", "D406", "D407",
    "E501",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "TC001", "TC002", "TC003",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components"]
explicit_package_bases = true
